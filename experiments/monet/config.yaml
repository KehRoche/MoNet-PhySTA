config1:
  dataset: 'PEMS-BAY'
  model_name: 'monet'
  # Model Args
  hidden_dim: 64
  emd_dim: 16
  covariate_dim: 2
  emb_way: 'SPO'
  n_heads: 4
  tcn_layers: 3
  num_nodes: 325
  hidden_channels: [16, 32,64]
  condition_emb: 8
  #IRM
  temp_penalty: 0.1
  spital_penalty: 0.1

  #KNO
  kno_layers: 2
  temp_ampify: 2
  freq_modes: 9

  kernel_size: 5
  head_dropout: 0.1
  #spita
  adp_adj: true
  num_gconv: 4
  time_emb_dim: 16