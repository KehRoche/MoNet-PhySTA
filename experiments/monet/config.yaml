config1:
  dataset: 'PEMS-BAY'
  model_name: 'monet'
  # Model Args
  hidden_dim: 64
  emd_dim: 16
  covariate_dim: 2

  tcn_layers: 1
  num_nodes: 325
  hidden_channels: [16, 32,64]
  #IRM
  temp_penalty: 0.1
  spital_penalty: 0.1

  #KNO
  kno_layers: 2
  temp_ampify: 2
  freq_modes: 9
  #PatchMixer
  patch_size: 4
  stride: 4
  kernel_size: 3
  head_dropout: 0.05
  #spital
  num_gconv: 2
  time_emb_dim: 16